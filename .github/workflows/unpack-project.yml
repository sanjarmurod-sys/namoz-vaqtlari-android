name: Namoz manbasini ochish va buildlarni boshlash
on:
  push:
    paths:
      - 'source-ready.trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Manbani olish
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ZIP qismlarini yig‘ish va ochish
        run: |
          set -euo pipefail
          cat source-parts/part-*.b64 > /tmp/namoz-source.zip.b64
          base64 --decode /tmp/namoz-source.zip.b64 > /tmp/namoz-source.zip
          unzip -t /tmp/namoz-source.zip
          mkdir -p /tmp/namoz-source
          unzip -oq /tmp/namoz-source.zip -d /tmp/namoz-source
          cp -a /tmp/namoz-source/NamozVaqtlari/. .
          rm -rf source-parts source-ready.trigger /tmp/namoz-source
          rm -f /tmp/namoz-source.zip /tmp/namoz-source.zip.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Namoz Vaqtlari Android app and public Telegram sync"
          git push

      - name: Android APK yig‘ilishini ishga tushirish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-apk.yml --ref main

      - name: Telegram ommaviy manbasini tekshirish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sync-public-telegram.yml --ref main
