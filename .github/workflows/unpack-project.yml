name: Extract project source and start APK build
on:
  push:
    paths:
      - 'source-parts/**'
      - 'source-ready.trigger'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Join and extract source archive
        run: |
          mkdir -p /tmp/namoz-source
          cat source-parts/part-*.b64 > /tmp/namoz-source.zip.b64
          base64 --decode /tmp/namoz-source.zip.b64 > /tmp/namoz-source.zip
          unzip -oq /tmp/namoz-source.zip -d /tmp/namoz-source
          cp -a /tmp/namoz-source/NamozVaqtlari/. .
          rm -rf source-parts source-ready.trigger /tmp/namoz-source
          rm -f /tmp/namoz-source.zip /tmp/namoz-source.zip.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Namoz Vaqtlari Android source and Telegram sync"
          git push
      - name: Start Android APK workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-apk.yml --ref main
