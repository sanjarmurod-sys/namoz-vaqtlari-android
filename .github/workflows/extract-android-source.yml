name: Extract Android source archive

on:
  push:
    branches: [ main ]
    paths:
      - '.source-upload/complete.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack Android source
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .source-upload -maxdepth 1 -name 'part-*.b64' -type f | wc -l)" -eq 16
          cat .source-upload/part-*.b64 > /tmp/namoz-app.zip.b64
          base64 --decode /tmp/namoz-app.zip.b64 > /tmp/namoz-app.zip
          unzip -t /tmp/namoz-app.zip
          mkdir -p /tmp/namoz-app
          unzip -oq /tmp/namoz-app.zip -d /tmp/namoz-app
          test -f /tmp/namoz-app/app/src/main/assets/index.html
          test -f /tmp/namoz-app/app/src/main/java/uz/namozvaqtlari/app/MainActivity.kt
          test -f /tmp/namoz-app/app/build.gradle.kts
          cp -a /tmp/namoz-app/app ./app
          cp /tmp/namoz-app/build.gradle.kts ./build.gradle.kts
          cp /tmp/namoz-app/settings.gradle.kts ./settings.gradle.kts
          cp /tmp/namoz-app/gradle.properties ./gradle.properties
          cp /tmp/namoz-app/.gitignore ./.gitignore
          rm -rf .source-upload /tmp/namoz-app /tmp/namoz-app.zip /tmp/namoz-app.zip.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitignore app build.gradle.kts settings.gradle.kts gradle.properties
          git commit -m "Add native Android Namoz Vaqtlari app source"
          git push
